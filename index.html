<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E8971E">
  <title>Kaizen — Customer Follow-up System</title>

  <link rel="icon" href="https://kaizen-egypt.com/wp-content/uploads/2023/06/logo-web-1-01.png">
  <link rel="apple-touch-icon" href="https://kaizen-egypt.com/wp-content/uploads/2023/06/logo-web-1-01.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=4">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- ===== Boot loader ===== -->
  <div id="loader" role="status" aria-live="polite">
    <div class="loader-logo"><img src="https://kaizen-egypt.com/wp-content/uploads/2023/06/logo-web-1-01.png" alt="Kaizen"></div>
    <div class="loader-title">KAIZEN</div>
    <div class="loader-bar"><i></i></div>
  </div>

  <!-- ===== Connection banner ===== -->
  <div id="netBar" role="alert"></div>

  <!-- ===== Auth screens (role select / login) ===== -->
  <div id="authView"></div>

  <!-- ===== Main application shell ===== -->
  <div id="appView">
    <aside class="sidebar" id="sidebar" aria-label="main navigation"></aside>
    <div id="sideOverlay" onclick="toggleSidebar(false)"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- ===== Overlays ===== -->
  <div id="modalRoot"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="printArea"></div>

  <script src="app.js?v=4"></script>
</body>
</html>
