<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>KAIZEN Operations</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233B82F6'/%3E%3Ctext x='32' y='44' font-size='34' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="manifest" href='data:application/manifest+json,{"name":"KAIZEN Operations","short_name":"KAIZEN","start_url":".","display":"standalone","background_color":"%230F172A","theme_color":"%230F172A","icons":[{"src":"data:image/svg+xml,%253Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%253E%253Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%25233B82F6%27/%253E%253Ctext x=%2732%27 y=%2744%27 font-size=%2734%27 font-family=%27Arial%27 font-weight=%27bold%27 fill=%27white%27 text-anchor=%27middle%27%253EK%253C/text%253E%253C/svg%253E","sizes":"192x192","type":"image/svg+xml"}]}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0F172A;--bg2:#0B1222;--card:#1E293B;--card2:#16213A;
  --primary:#3B82F6;--primary-2:#2563EB;--success:#22C55E;--warning:#F59E0B;--danger:#EF4444;
  --violet:#8B5CF6;--text:#E2E8F0;--muted:#94A3B8;--dim:#64748B;
  --border:rgba(148,163,184,.14);--radius:16px;
  --shadow:0 10px 30px rgba(0,0,0,.35);--glass:rgba(30,41,59,.62);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(59,130,246,.12),transparent 60%),radial-gradient(900px 500px at 10% 110%,rgba(139,92,246,.10),transparent 60%),var(--bg);color:var(--text);font-family:'Tajawal','Inter',system-ui,sans-serif;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:'Inter','Tajawal',system-ui,sans-serif}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#334155;border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;color:var(--text);background:rgba(15,23,42,.65);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px;width:100%;transition:border-color .2s,box-shadow .2s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
input::placeholder,textarea::placeholder{color:var(--dim)}
select option{background:#1E293B;color:var(--text)}
label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:7px;font-weight:500}
a{color:var(--primary);text-decoration:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes ripple{to{transform:scale(3.4);opacity:0}}
@keyframes loadslide{0%{margin-inline-start:-40%}100%{margin-inline-start:100%}}
.anim-up{animation:slideUp .45s cubic-bezier(.22,.9,.3,1) both}
.anim-fade{animation:fadeIn .4s both}
#loader{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .45s}
#loader.hide{opacity:0;pointer-events:none}
.loader-logo{width:76px;height:76px;border-radius:20px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:800;color:#fff;box-shadow:0 12px 40px rgba(59,130,246,.4);animation:pulse 1.4s infinite}
.loader-bar{width:180px;height:5px;border-radius:99px;background:#1E293B;overflow:hidden}
.loader-bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#3B82F6,#8B5CF6);animation:loadslide 1.1s ease-in-out infinite}
#loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.login-card{width:100%;max-width:430px;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:24px;padding:38px 32px;box-shadow:var(--shadow);animation:scaleIn .5s cubic-bezier(.22,.9,.3,1) both;text-align:center}
.brand-logo{width:70px;height:70px;margin:0 auto 16px;border-radius:20px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff;box-shadow:0 10px 34px rgba(59,130,246,.42)}
.login-card h1{font-size:25px;font-weight:800;letter-spacing:.3px}
.login-card .sub{color:var(--muted);font-size:14px;margin:6px 0 26px}
.login-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;border-radius:14px;font-size:16px;font-weight:700;margin-bottom:13px;transition:transform .18s,box-shadow .18s,background .18s;position:relative;overflow:hidden}
.login-btn:hover{transform:translateY(-2px)}
.btn-blue{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;box-shadow:0 8px 24px rgba(59,130,246,.35)}
.btn-ghost{background:rgba(148,163,184,.09);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{background:rgba(148,163,184,.16)}
.lang-pill{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:9px 18px;border-radius:99px;border:1px solid var(--border);background:rgba(15,23,42,.5);font-size:14px;font-weight:600;transition:background .2s}
.lang-pill:hover{background:rgba(59,130,246,.14)}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;margin-bottom:18px;cursor:pointer}
.back-link:hover{color:var(--text)}
#appView{display:none;min-height:100vh}
#appView.on{display:flex}
.sidebar{width:264px;flex-shrink:0;background:rgba(11,18,34,.72);backdrop-filter:blur(14px);border-inline-end:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.side-head{display:flex;align-items:center;gap:12px;padding:22px 22px 18px}
.side-logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;flex-shrink:0}
.side-head b{font-size:17px;letter-spacing:.4px;display:block}
.side-head span{font-size:12.5px;color:var(--muted)}
.side-nav{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-radius:99px;color:var(--muted);font-size:15px;font-weight:500;transition:background .18s,color .18s;width:100%;text-align:start}
.nav-item svg{width:20px;height:20px;flex-shrink:0}
.nav-item:hover{background:rgba(148,163,184,.08);color:var(--text)}
.nav-item.active{background:rgba(59,130,246,.16);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(59,130,246,.35)}
.side-foot{padding:14px}
.logout-btn{width:100%;display:flex;align-items:center;gap:11px;padding:13px 16px;border-radius:14px;background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.2);color:#FCA5A5;font-weight:600;font-size:15px;transition:background .2s}
.logout-btn:hover{background:rgba(239,68,68,.18)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:14px 26px;background:rgba(15,23,42,.78);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.top-date{margin-inline-end:auto}
.top-date b{font-size:15px;display:block}
.top-date span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.search-wrap{position:relative;width:min(320px,34vw)}
.search-wrap input{padding-inline-start:40px;background:rgba(30,41,59,.55);border-radius:14px;height:44px}
.search-wrap svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--dim);pointer-events:none}
.icon-btn{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:rgba(30,41,59,.5);color:var(--muted);transition:background .2s;position:relative}
.icon-btn:hover{background:rgba(59,130,246,.14);color:var(--text)}
.content{padding:28px;max-width:1400px;width:100%;margin:0 auto}
.page-title{font-size:32px;font-weight:800;margin-bottom:4px}
.page-sub{color:var(--muted);font-size:14.5px;margin-bottom:26px}
.card{background:linear-gradient(160deg,rgba(30,41,59,.85),rgba(22,33,58,.85));border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:18px}
.stats-grid{grid-template-columns:repeat(4,1fr);margin-bottom:22px}
.stat-card{padding:20px 22px;border-radius:var(--radius);border:1px solid var(--border);position:relative;overflow:hidden;transition:transform .22s,box-shadow .22s;animation:slideUp .5s both}
.stat-card:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.4)}
.stat-card .row1{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.stat-card .label{font-size:14.5px;color:var(--muted);font-weight:600}
.stat-card .num{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.stat-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center}
.stat-ic svg{width:20px;height:20px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:99px;font-size:12.5px;font-weight:700;white-space:nowrap}
.b-waiting{background:rgba(148,163,184,.14);color:#CBD5E1}
.b-in_progress{background:rgba(59,130,246,.16);color:#93C5FD}
.b-completed{background:rgba(34,197,94,.15);color:#86EFAC}
.b-cancelled{background:rgba(239,68,68,.14);color:#FCA5A5}
.b-delayed{background:rgba(245,158,11,.15);color:#FCD34D}
.p-low{background:rgba(34,197,94,.15);color:#86EFAC}
.p-medium{background:rgba(59,130,246,.16);color:#93C5FD}
.p-high{background:rgba(245,158,11,.16);color:#FCD34D}
.p-urgent{background:rgba(239,68,68,.16);color:#FCA5A5}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;min-width:820px}
th{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;padding:14px 16px;text-align:start;background:rgba(15,23,42,.5);border-bottom:1px solid var(--border)}
td{padding:14px 16px;font-size:14.5px;border-bottom:1px solid rgba(148,163,184,.07);vertical-align:middle}
tbody tr{transition:background .15s;animation:fadeIn .35s both}
tbody tr:hover{background:rgba(59,130,246,.05)}
.tid{font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;cursor:pointer}
.row-actions{display:flex;gap:6px}
.act{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .15s,color .15s}
.act:hover{background:rgba(148,163,184,.12);color:#fff}
.act.danger:hover{background:rgba(239,68,68,.16);color:#FCA5A5}
.act svg{width:16px;height:16px}
.empty{padding:52px;text-align:center;color:var(--dim);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:13px;font-size:15px;font-weight:700;transition:transform .16s,box-shadow .16s,background .16s;position:relative;overflow:hidden}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;box-shadow:0 8px 22px rgba(59,130,246,.32)}
.btn-primary:hover{box-shadow:0 10px 28px rgba(59,130,246,.45);transform:translateY(-1px)}
.btn-outline{border:1px solid var(--border);background:rgba(148,163,184,.07);color:var(--text)}
.btn-outline:hover{background:rgba(148,163,184,.14)}
.btn-success{background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;box-shadow:0 8px 20px rgba(34,197,94,.28)}
.btn-danger{background:linear-gradient(135deg,#EF4444,#DC2626);color:#fff}
.btn-sm{padding:8px 14px;font-size:13.5px;border-radius:10px}
.btn svg,.login-btn svg,.icon-btn svg,.lang-pill svg,.x svg{width:18px;height:18px;flex-shrink:0}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:ripple .55s ease-out;pointer-events:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px}
.form-grid .full{grid-column:1/-1}
.prio-group{display:flex;gap:9px;flex-wrap:wrap}
.prio-chip{padding:9px 20px;border-radius:99px;border:1px solid var(--border);background:rgba(15,23,42,.5);font-size:14px;font-weight:600;color:var(--muted);transition:all .18s}
.prio-chip:hover{color:var(--text)}
.prio-chip.sel-low{background:rgba(34,197,94,.15);border-color:rgba(34,197,94,.5);color:#86EFAC}
.prio-chip.sel-medium{background:rgba(59,130,246,.16);border-color:rgba(59,130,246,.55);color:#93C5FD}
.prio-chip.sel-high{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.5);color:#FCD34D}
.prio-chip.sel-urgent{background:rgba(239,68,68,.16);border-color:rgba(239,68,68,.5);color:#FCA5A5}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{padding:8px 16px;border-radius:99px;border:1px solid var(--border);background:rgba(30,41,59,.5);font-size:13.5px;font-weight:600;color:var(--muted);transition:all .16s}
.chip:hover{color:var(--text)}
.chip.on{background:rgba(59,130,246,.18);border-color:rgba(59,130,246,.55);color:#BFDBFE}
.emp-grid{grid-template-columns:repeat(3,1fr)}
.emp-card{padding:24px;border-radius:var(--radius);border:1px solid var(--border);transition:transform .2s,box-shadow .2s;cursor:pointer;animation:slideUp .45s both}
.emp-card:hover{transform:translateY(-4px);box-shadow:0 16px 38px rgba(0,0,0,.42)}
.avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:800;color:#fff;flex-shrink:0}
.emp-top{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.emp-top b{font-size:18px;display:block}
.emp-top span{color:var(--muted);font-size:13.5px}
.emp-nums{display:flex;justify-content:space-between;text-align:center;margin-bottom:18px}
.emp-nums .n{font-size:24px;font-weight:800}
.emp-nums .l{font-size:11px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-top:2px}
.pbar{height:7px;border-radius:99px;background:rgba(148,163,184,.14);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#3B82F6,#8B5CF6);transition:width .6s cubic-bezier(.22,.9,.3,1)}
.pbar-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.today-hero{display:flex;align-items:center;gap:26px;padding:26px;border-radius:20px;background:linear-gradient(135deg,rgba(59,130,246,.16),rgba(139,92,246,.12));border:1px solid rgba(59,130,246,.25);margin-bottom:24px;flex-wrap:wrap}
.ring{position:relative;width:104px;height:104px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
.task-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.tcard{padding:20px;border-radius:var(--radius);border:1px solid var(--border);display:flex;flex-direction:column;gap:12px;animation:slideUp .4s both;transition:transform .2s,box-shadow .2s;border-inline-start:4px solid var(--dim)}
.tcard:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(0,0,0,.4)}
.tcard.pl-urgent{border-inline-start-color:var(--danger)}
.tcard.pl-high{border-inline-start-color:var(--warning)}
.tcard.pl-medium{border-inline-start-color:var(--primary)}
.tcard.pl-low{border-inline-start-color:var(--success)}
.tcard .thead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tcard .cust{font-size:17px;font-weight:800}
.tcard .desc{color:var(--muted);font-size:14.5px;line-height:1.55}
.tcard .meta{display:flex;flex-wrap:wrap;gap:7px}
.tcard .foot{display:flex;gap:9px;margin-top:auto}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:18px}
.bcol{border-radius:var(--radius);border:1px solid var(--border);background:linear-gradient(170deg,rgba(30,41,59,.8),rgba(22,33,58,.75));display:flex;flex-direction:column;min-height:220px;transition:box-shadow .2s,border-color .2s}
.bcol.dragover{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.22)}
.bcol-head{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)}
.bcol-head .avatar{width:42px;height:42px;font-size:17px}
.bcol-head b{font-size:15.5px;display:block}
.bcol-head span{font-size:12.5px;color:var(--muted)}
.bcol-head .cnt{margin-inline-start:auto;background:rgba(59,130,246,.16);color:#93C5FD;font-size:12.5px;font-weight:700;padding:3px 11px;border-radius:99px}
.bcol-body{padding:12px;display:flex;flex-direction:column;gap:9px;flex:1}
.bitem{padding:11px 13px;border-radius:12px;background:rgba(15,23,42,.6);border:1px solid var(--border);cursor:grab;font-size:14px;display:flex;flex-direction:column;gap:6px;transition:transform .15s,box-shadow .15s}
.bitem:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.35)}
.bitem.dragging{opacity:.45}
.bitem .r1{display:flex;align-items:center;gap:8px}
.bitem .chk{width:19px;height:19px;border-radius:6px;border:2px solid var(--dim);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;cursor:pointer}
.bitem.done .chk{background:var(--success);border-color:var(--success)}
.bitem.done .txt{text-decoration:line-through;color:var(--dim)}
.bitem .txt{flex:1;font-weight:600;cursor:pointer}
.bitem .r2{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim)}
.badd{border:1.5px dashed rgba(148,163,184,.3);border-radius:12px;padding:9px;color:var(--dim);font-size:13.5px;font-weight:600;transition:all .15s}
.badd:hover{border-color:var(--primary);color:var(--primary)}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}
.kcol{border-radius:var(--radius);border:1px solid var(--border);background:rgba(22,33,58,.7);display:flex;flex-direction:column;min-height:300px}
.kcol.dragover{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.kcol-head{display:flex;align-items:center;gap:9px;padding:14px 16px;font-weight:800;font-size:14.5px;border-bottom:1px solid var(--border)}
.kcol-head .cnt{margin-inline-start:auto;font-size:12px;background:rgba(148,163,184,.14);padding:2px 10px;border-radius:99px;color:var(--muted)}
.kcol-body{padding:11px;display:flex;flex-direction:column;gap:9px;flex:1}
.kitem{padding:12px;border-radius:12px;background:rgba(15,23,42,.62);border:1px solid var(--border);cursor:grab;display:flex;flex-direction:column;gap:7px}
.kitem.dragging{opacity:.45}
.kitem .kc{font-weight:700;font-size:14px}
.kitem .kd{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kitem .kf{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(15,23,42,.6);border:1px solid var(--border);border-radius:13px;padding:4px;gap:3px}
.seg button{padding:8px 18px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--muted);transition:all .16s}
.seg button.on{background:rgba(59,130,246,.2);color:#BFDBFE}
.hbar-row{display:flex;align-items:center;gap:12px;margin-bottom:13px;animation:fadeIn .4s both}
.hbar-row .lb{width:110px;flex-shrink:0;font-size:13.5px;color:var(--muted);text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar-row .tr{flex:1;height:9px;border-radius:99px;background:rgba(148,163,184,.1);overflow:hidden}
.hbar-row .tr i{display:block;height:100%;border-radius:99px;transition:width .7s cubic-bezier(.22,.9,.3,1)}
.hbar-row .vl{width:30px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;text-align:end}
.week-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.wbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.wbar .bar{width:100%;max-width:42px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#3B82F6,#2563EB);min-height:4px;transition:height .7s cubic-bezier(.22,.9,.3,1);position:relative}
.wbar .bar .tip{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:var(--muted)}
.wbar .day{font-size:11.5px;color:var(--dim)}
.timeline{position:relative;padding-inline-start:24px}
.timeline::before{content:"";position:absolute;inset-inline-start:7px;top:6px;bottom:6px;width:2px;background:rgba(148,163,184,.15);border-radius:2px}
.tl-item{position:relative;padding-bottom:20px;animation:fadeIn .4s both}
.tl-item::before{content:"";position:absolute;inset-inline-start:-24px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--primary);border:3px solid var(--bg);box-shadow:0 0 0 2px rgba(59,130,246,.4)}
.tl-item .tt{font-size:14.5px;font-weight:600}
.tl-item .ts{font-size:12.5px;color:var(--dim);margin-top:2px}
.modal-bg{position:fixed;inset:0;background:rgba(2,6,17,.68);backdrop-filter:blur(6px);z-index:90;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .22s both}

.modal h3{font-size:20px;font-weight:800;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}

.modal .x:hover{background:rgba(148,163,184,.12);color:#fff}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}

  el.innerHTML=`<div class="ti">${icons[type]}</div><div>${esc(msg)}</div>`;

function setDbStatus(ok,msg){
  const dot=$("#dbDot"),label=$("#dbLabel");
  if(dot)dot.style.background=ok?"#22C55E":ok===null?"#F59E0B":"#EF4444";
  if(label)label.textContent=msg;

async function initSupabase(){
  setDbStatus(null,t("initDb"));
  try{
    /* Try creating tables via RPC — this may fail if no RPC exists so we use REST to check if tables exist */
    /* Check if employees table exists by querying it */
    const{data:empCheck,error:empErr}=await sb.from("employees").select("id").limit(1);
    if(empErr&&(empErr.code==="42P01"||empErr.message.includes("does not exist"))){
      /* Tables don't exist — we need to create them via SQL Editor.
         Since anon key can't run raw SQL, we'll use the REST API to create data.
         Show the user the SQL they need to run. */
      showSqlSetupModal();
      return false;
    }
    if(empErr){
      console.error("Supabase error:",empErr);
      setDbStatus(false,t("dbError")+" — "+empErr.message);
      return false;
    }

    /* Tables exist — seed if empty */
    if(!empCheck||empCheck.length===0){
      /* Seed departments */
      for(const d of seedDepts){
        await sb.from("departments").upsert({name:d},{onConflict:"name"});
      }
      /* Seed employees */
      for(const e of seedEmps){
        const{data:exists}=await sb.from("employees").select("id").eq("name",e.name).limit(1);
        if(!exists||exists.length===0){
          await sb.from("employees").insert(e);
        }
      }
      /* Seed settings */
      await sb.from("settings").upsert({id:1,password:"2010",company:"KAIZEN Printing",company_ar:"كايزن للطباعة",seq:0,default_dept:"Sales"},{onConflict:"id"});
    }

    /* Load all data */
    await loadAllData();

    /* Setup Realtime */
    setupRealtime();

    SB_READY=true;
    setDbStatus(true,t("dbConnected"));
    return true;
  }catch(err){
    console.error("Init error:",err);
    setDbStatus(false,t("dbError"));
    return false;
  }
}

async function loadAllData(){
  const[empRes,deptRes,taskRes,histRes,setRes]=await Promise.all([
    sb.from("employees").select("*").eq("active",true).order("created_at"),
    sb.from("departments").select("*").order("created_at"),
    sb.from("tasks").select("*").order("created_at",{ascending:false}),
    sb.from("task_history").select("*").order("created_at",{ascending:false}).limit(200),
    sb.from("settings").select("*").eq("id",1).single()
  ]);
  EMPLOYEES=empRes.data||[];
  DEPARTMENTS=deptRes.data||[];
  TASKS=taskRes.data||[];
  HISTORY=histRes.data||[];
  if(setRes.data)SETTINGS={password:setRes.data.password,company:setRes.data.company,companyAr:setRes.data.company_ar,seq:setRes.data.seq||0,defaultDept:setRes.data.default_dept||"Sales"};
}

/* ============ SUPABASE REALTIME ============ */
function setupRealtime(){
  sb.channel("kaizen-realtime")
    .on("postgres_changes",{event:"*",schema:"public",table:"tasks"},async()=>{
      const{data}=await sb.from("tasks").select("*").order("created_at",{ascending:false});
      TASKS=data||[];
      rerenderCurrent();
      if(session&&session.role==="employee") toast(t("taskUpdated"),"i");
    })
    .on("postgres_changes",{event:"*",schema:"public",table:"employees"},async()=>{
      const{data}=await sb.from("employees").select("*").eq("active",true).order("created_at");
      EMPLOYEES=data||[];
      rerenderCurrent();
    })
    .subscribe();
}

async function addHistory(taskId,action,extra=""){
  const actor=session?(session.role==="admin"?"Admin":empName(session.empId)):"System";
  const rec={task_id:taskId,action,extra,actor};
  await sb.from("task_history").insert(rec);
  HISTORY.unshift({...rec,created_at:nowISO()});
}

function viewDashboard(){
  const live=TASKS.filter(x=>!x.archived);
  const doneToday=live.filter(x=>x.status==="completed"&&isToday(x.completed_at)).length;
  const inProg=live.filter(x=>x.status==="in_progress").length;
  const waiting=live.filter(x=>x.status==="waiting").length;
  const delayed=live.filter(x=>x.status==="delayed").length;
  const cancelled=live.filter(x=>x.status==="cancelled").length;
  const todayTasks=live.filter(x=>taskDay(x)===todayStr()||isToday(x.created_at));
  const working=new Set(todayTasks.map(x=>x.employee_id)).size;
  const prod=todayTasks.length?Math.round(todayTasks.filter(x=>x.status==="completed").length/todayTasks.length*100):0;
  const cards=[["totalTasks",live.length,IC.tasks,"#3B82F6"],["doneToday",doneToday,IC.check,"#22C55E"],["inProgress",inProg,IC.pulse,"#3B82F6"],["waiting",waiting,IC.clock,"#94A3B8"],["delayed",delayed,IC.warn,"#F59E0B"],["cancelled",cancelled,IC.xmark,"#EF4444"],["workingToday",working,IC.users,"#8B5CF6"],["productivity",prod+"%",IC.trend,"#22C55E"]];
  const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
  const wk=days.map(d=>{const ds=todayStr(d);return{d,n:TASKS.filter(x=>x.completed_at&&isSameDay(x.completed_at,ds)).length}});
  const wmax=Math.max(1,...wk.map(x=>x.n));
  const byDept=DEPARTMENTS.map(d=>({n:d.name,c:live.filter(x=>x.department===d.name).length})).filter(x=>x.c>0).sort((a,b)=>b.c-a.c);
  const dmax=Math.max(1,...byDept.map(x=>x.c));
  const acts=HISTORY.slice(0,9);
  const palette=["#3B82F6","#8B5CF6","#22C55E","#F59E0B","#EC4899","#06B6D4","#EF4444"];
  return`<h1 class="page-title anim-up">${t("overview")}</h1>
  <div class="page-sub anim-up">${new Date().toLocaleDateString(LANG==="ar"?"ar-EG":"en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
  <div class="grid stats-grid">${cards.map(([k,v,ic,col],i)=>`<div class="stat-card card" style="animation-delay:${i*50}ms"><div class="row1"><span class="label">${t(k)}</span><span class="stat-ic" style="background:${col}1f;color:${col}">${ic}</span></div><div class="num">${v}</div></div>`).join("")}</div>
  <div class="grid dash-grid">
    <div class="card anim-up" style="padding:24px"><b style="font-size:17px;display:block;margin-bottom:18px">${t("weekly")}</b>
    <div class="week-chart">${wk.map(x=>`<div class="wbar"><div class="bar" style="height:${Math.max(4,x.n/wmax*100)}%"><span class="tip">${x.n||""}</span></div><span class="day">${x.d.toLocaleDateString(LANG==="ar"?"ar-EG":"en-GB",{weekday:"short"})}</span></div>`).join("")}</div></div>
    <div class="card anim-up" style="padding:24px"><b style="font-size:17px;display:block;margin-bottom:18px">${t("byDept")}</b>
    ${byDept.length?byDept.map((x,i)=>`<div class="hbar-row"><span class="lb">${esc(x.n)}</span><span class="tr"><i style="width:${x.c/dmax*100}%;background:${palette[i%7]}"></i></span><span class="vl">${x.c}</span></div>`).join(""):`<div class="empty">${t("noResults")}</div>`}</div>
    <div class="card anim-up" style="padding:24px"><b style="font-size:17px;display:block;margin-bottom:18px">${t("recentActivity")}</b>
    ${acts.length?`<div class="timeline">${acts.map(h=>`<div class="tl-item"><div class="tt">${t(h.action)} — <span class="tid" onclick="openTaskDetails('${h.task_id}')">${h.task_id}</span></div><div class="ts">${esc(h.actor)} • ${fmtFull(h.created_at)}</div></div>`).join("")}</div>`:`<div class="empty">${t("noResults")}</div>`}</div>
  </div>`;
}

/* ============ TASKS ============ */
let taskFilter="all";
function filteredTasks(){
  let list=TASKS.filter(x=>!x.archived);
  const q=topSearch.trim().toLowerCase();
  if(q)list=list.filter(x=>[x.task_id,x.customer_name,x.department,empName(x.employee_id),t("s_"+x.status),t(x.priority),x.description].join(" ").toLowerCase().includes(q));
  const ds=todayStr();const yd=new Date();yd.setDate(yd.getDate()-1);const ys=todayStr(yd);const wk=new Date();wk.setDate(wk.getDate()-7);const mo=new Date();mo.setDate(mo.getDate()-30);
  switch(taskFilter){case"today":list=list.filter(x=>taskDay(x)===ds||isToday(x.created_at));break;case"yesterday":list=list.filter(x=>taskDay(x)===ys);break;case"week":list=list.filter(x=>new Date(x.created_at)>=wk);break;case"month":list=list.filter(x=>new Date(x.created_at)>=mo);break;case"completed":case"waiting":case"in_progress":case"delayed":case"cancelled":list=list.filter(x=>x.status===taskFilter);break}
  return list;
}

function bindKanbanDnD(){
  let dragTid=null;
  document.querySelectorAll(".kitem").forEach(el=>{el.addEventListener("dragstart",e=>{dragTid=el.dataset.tid;el.classList.add("dragging")});el.addEventListener("dragend",()=>el.classList.remove("dragging"))});
  document.querySelectorAll(".kcol").forEach(col=>{col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("dragover")});col.addEventListener("dragleave",()=>col.classList.remove("dragover"));col.addEventListener("drop",e=>{e.preventDefault();col.classList.remove("dragover");if(dragTid)changeStatus(dragTid,col.dataset.status);dragTid=null})});

async function changeStatus(tid,status){
  const x=TASKS.find(x=>x.task_id===tid);if(!x||x.status===status)return;
  const upd={status,updated_at:nowISO()};
  if(status==="completed")upd.completed_at=nowISO();else upd.completed_at=null;
  const{error}=await sb.from("tasks").update(upd).eq("task_id",tid);
  if(error){toast(error.message,"e");return}
  Object.assign(x,upd);
  const actMap={completed:"actCompleted",in_progress:"actStarted",cancelled:"actCancelled",delayed:"actDelayed",waiting:"actStatus"};
  await addHistory(tid,actMap[status]||"actStatus",status);
  await notifyEmp(x.employee_id,t("taskUpdated")+" • "+tid);
  toast(status==="completed"?t("taskCompleted"):t("taskUpdated"),"s");
  rerenderCurrent();
}

async function duplicateTask(tid){
  const x=TASKS.find(x=>x.task_id===tid);if(!x)return;
  const newTid=await nextTaskId();
  const task={task_id:newTid,customer_name:x.customer_name,department:x.department,employee_id:x.employee_id,description:x.description,quantity:x.quantity,priority:x.priority,status:"waiting",notes:x.notes,due_date:todayStr(),created_by:"Admin"};
  await sb.from("tasks").insert(task);
  await addHistory(newTid,"actCreated","duplicate of "+tid);
  TASKS.unshift({...task,created_at:nowISO(),updated_at:nowISO(),completed_at:null,archived:false});
  toast(t("taskDuplicated")+" • "+newTid,"s");rerenderCurrent();
}

function deleteTask(tid){confirmModal(t("confirmDelete"),async()=>{
  await sb.from("tasks").delete().eq("task_id",tid);

async function restoreTask(tid){

    const newStat=$("#eStat").value;const statChanged=newStat!==x.status;

    if(statChanged){upd.completed_at=newStat==="completed"?nowISO():null}
    await sb.from("tasks").update(upd).eq("task_id",x.task_id);
    Object.assign(x,upd);
    if(statChanged)await addHistory(x.task_id,"actStatus",newStat);
    await addHistory(x.task_id,"actEdited");
    const h=$("#autosaveHint");if(h){h.style.color="var(--success)";h.textContent="✓ "+t("dataSaved");setTimeout(()=>{if(h)h.style.color="var(--dim)"},800)}
    rerenderCurrent();
  };
  let deb=null;
  $("#modalRoot").querySelectorAll("input,select,textarea").forEach(el=>{el.addEventListener("input",()=>{clearTimeout(deb);deb=setTimeout(commit,650)});el.addEventListener("change",()=>{clearTimeout(deb);commit()})});
}

function afterBoard(){
  let dragTid=null;
  document.querySelectorAll(".bitem").forEach(el=>{el.addEventListener("dragstart",()=>{dragTid=el.dataset.tid;el.classList.add("dragging")});el.addEventListener("dragend",()=>el.classList.remove("dragging"))});
  document.querySelectorAll(".bcol").forEach(col=>{col.addEventListener("dragover",e=>{e.preventDefault();col.classList.add("dragover")});col.addEventListener("dragleave",()=>col.classList.remove("dragover"));col.addEventListener("drop",async e=>{
    e.preventDefault();col.classList.remove("dragover");if(!dragTid)return;
    const x=TASKS.find(x=>x.task_id===dragTid);
    if(x&&x.employee_id!==col.dataset.emp){
      const newEmp=empById(col.dataset.emp);
      await sb.from("tasks").update({employee_id:col.dataset.emp,department:newEmp.department,updated_at:nowISO()}).eq("task_id",dragTid);
      x.employee_id=col.dataset.emp;x.department=newEmp.department;
      await addHistory(dragTid,"actMoved",newEmp.name);
      toast(t("taskMoved"),"s");rerenderCurrent();
    }dragTid=null})});
}
function toggleBoardDone(tid){const x=TASKS.find(x=>x.task_id===tid);if(!x)return;changeStatus(tid,x.status==="completed"?"waiting":"completed")}

async function duplicateYesterday(){
  const yd=new Date();yd.setDate(yd.getDate()-1);const ys=todayStr(yd);
  const yTasks=TASKS.filter(x=>taskDay(x)===ys);

  confirmModal(t("dupYesterday")+" ("+yTasks.length+")",async()=>{
    for(const x of yTasks){
      const tid=await nextTaskId();
      const task={task_id:tid,customer_name:x.customer_name,department:x.department,employee_id:x.employee_id,description:x.description,quantity:x.quantity,priority:x.priority,status:"waiting",notes:x.notes||"",due_date:todayStr(),created_by:"Admin"};
      await sb.from("tasks").insert(task);
      TASKS.unshift({...task,created_at:nowISO(),updated_at:nowISO(),completed_at:null,archived:false});
    }

}
async function saveSettings(){
  SETTINGS.company=$("#setCo").value.trim()||"KAIZEN Printing";SETTINGS.companyAr=$("#setCoAr").value.trim()||"كايزن للطباعة";
  await sb.from("settings").update({company:SETTINGS.company,company_ar:SETTINGS.companyAr}).eq("id",1);
  toast(t("dataSaved"),"s");renderSidebar();
}
async function changePass(){
  const p=$("#setPass").value.trim();if(p.length<3){toast(t("fillRequired"),"w");return}
  SETTINGS.password=p;await sb.from("settings").update({password:p}).eq("id",1);
  $("#setPass").value="";toast(t("passChanged"),"s");
}

/* ============ EMPLOYEE HOME ============ */
function viewEmpHome(){
  const me=empById(session.empId);if(!me)return`<div class="empty">Employee not found</div>`;
  const mine=TASKS.filter(x=>!x.archived&&x.employee_id===session.empId&&taskDay(x)===todayStr()&&x.status!=="cancelled");
  const done=mine.filter(x=>x.status==="completed").length;const pct=mine.length?Math.round(done/mine.length*100):0;
  const hour=new Date().getHours();const greet=hour<12?t("goodMorning"):t("goodEvening");const circ=2*Math.PI*44;
  return`<div class="today-hero anim-up"><div class="ring"><svg width="104" height="104"><circle cx="52" cy="52" r="44" fill="none" stroke="rgba(148,163,184,.15)" stroke-width="9"/><circle cx="52" cy="52" r="44" fill="none" stroke="#3B82F6" stroke-width="9" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct/100)}" style="transition:stroke-dashoffset .8s cubic-bezier(.22,.9,.3,1)"/></svg><span class="pct">${pct}%</span></div>
  <div style="flex:1;min-width:200px"><div style="font-size:24px;font-weight:800">${greet}${LANG==="ar"?"، ":", "}${esc(me.name)} 👋</div><div style="color:var(--muted);margin-top:4px">${esc(me.department)} — ${new Date().toLocaleDateString(LANG==="ar"?"ar-EG":"en-GB",{weekday:"long",day:"numeric",month:"long"})}</div>
  <div style="display:flex;gap:26px;margin-top:16px;flex-wrap:wrap"><div><div style="font-size:26px;font-weight:800">${mine.length}</div><div style="font-size:12.5px;color:var(--muted)">${t("todayTasks")}</div></div><div><div style="font-size:26px;font-weight:800;color:var(--success)">${done}</div><div style="font-size:12.5px;color:var(--muted)">${t("completedT")}</div></div><div><div style="font-size:26px;font-weight:800;color:var(--warning)">${mine.length-done}</div><div style="font-size:12.5px;color:var(--muted)">${t("remaining")}</div></div></div></div></div>
  ${mine.length?`<div class="task-cards">${mine.map((x,i)=>`<div class="tcard card pl-${x.priority}" style="animation-delay:${i*60}ms">
    <div class="thead"><span class="tid">${x.task_id}</span>${statBadge(x.status)}</div>
    <div class="cust">${esc(x.customer_name)}</div><div class="desc">${esc(x.description)}</div>
    <div class="meta">${prioBadge(x.priority)}<span class="badge b-waiting">${esc(x.department)}</span><span class="badge b-waiting">×${x.quantity}</span><span class="badge b-waiting">🕐 ${fmtTime(x.created_at)}</span></div>
    ${x.notes?`<div style="font-size:13px;color:var(--dim);background:rgba(15,23,42,.5);border-radius:10px;padding:9px 12px">📝 ${esc(x.notes)}</div>`:""}
    <div class="foot">
      ${x.status==="waiting"||x.status==="delayed"?`<button class="btn btn-primary btn-sm" style="flex:1" onclick="changeStatus('${x.task_id}','in_progress')">${IC.play} ${t("start")}</button>`:""}
      ${x.status==="in_progress"?`<button class="btn btn-success btn-sm" style="flex:1" onclick="changeStatus('${x.task_id}','completed')">${IC.check} ${t("complete")}</button>`:""}
      ${x.status==="completed"?`<button class="btn btn-outline btn-sm" style="flex:1" disabled>✓ ${t("s_completed")}</button>`:""}
      <button class="btn btn-outline btn-sm" onclick="openTaskDetails('${x.task_id}')">${t("details")}</button>
    </div></div>`).join("")}</div>`:`<div class="card empty anim-up" style="font-size:18px;padding:70px">${t("noTasksToday")}</div>`}`;
}

/* ============ NETWORK ============ */
function netStatus(){const bar=$("#offlineBar");if(navigator.onLine){if(bar.classList.contains("on"))toast(t("online"),"s");bar.classList.remove("on")}else{bar.textContent=t("offline");bar.classList.add("on")}}
window.addEventListener("online",netStatus);window.addEventListener("offline",netStatus);

/* ============ PWA install ============ */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e});

/* ============ BOOT ============ */
(async function boot(){
  netStatus();
  const ok=await initSupabase();
  if(ok){
    render();
    setTimeout(()=>{const l=$("#loader");if(l){l.classList.add("hide");setTimeout(()=>l.remove(),500)}},600);
  }else{
    /* If Supabase tables don't exist, loader stays until user fixes it */
    setTimeout(()=>{const l=$("#loader");if(l){l.classList.add("hide");setTimeout(()=>l.remove(),500)}},1500);
  }
})();
</script>
</body>
